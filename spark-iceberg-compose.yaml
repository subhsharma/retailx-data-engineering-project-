services:

  spark-master:
    image: openlakehouse-spark:3.5.6
    container_name: retailx-spark-master
    hostname: spark-master
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /dev/null
      "
    ports:
      - "7077:7077"
      - "18080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
    volumes:
      - ./spark-conf:/opt/spark/conf
    networks:
      - retailx-network

  spark-worker:
    image: openlakehouse-spark:3.5.6
    container_name: retailx-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /dev/null
      "
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
    volumes:
      - ./spark-conf:/opt/spark/conf
    networks:
      - retailx-network
    
  spark-thrift:
    image: openlakehouse-spark:3.5.6
    container_name: retailx-spark-thrift
    hostname: spark-thrift
    depends_on:
      - spark-master
      - spark-worker
    command: >
      bash -c "
      /opt/spark/sbin/start-thriftserver.sh
      --master spark://spark-master:7077
      --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      --conf spark.sql.catalog.retailx=org.apache.iceberg.spark.SparkCatalog
      --conf spark.sql.catalog.retailx.type=hadoop
      --conf spark.sql.catalog.retailx.warehouse=s3a://retailx/warehouse
      --conf spark.hadoop.fs.s3a.endpoint=http://retailx-minio:9000
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      --conf spark.sql.adaptive.enabled=true
      --conf spark.sql.adaptive.coalescePartitions.enabled=true
      ;
      tail -f /dev/null
      "
    ports:
      - "10000:10000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
    volumes:
      - ./spark-conf:/opt/spark/conf
    networks:
      - retailx-network

networks:
  retailx-network:
    external: true
    name: retailx-cloud-data-platform_default