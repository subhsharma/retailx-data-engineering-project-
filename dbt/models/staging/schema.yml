version: 2

models:

  - name: stg_customers
    description: "Cleaned customer staging data from RAW.CUSTOMERS"

    columns:

      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - not_null
          - unique

      - name: email
        description: "Customer email address"
        tests:
          - not_null

      - name: signup_date
        description: "Customer registration date"
        tests:
          - not_null


  - name: stg_products
    description: "Cleaned product staging data from RAW.PRODUCTS"

    columns:

      - name: product_id
        description: "Unique identifier for each product"
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name"
        tests:
          - not_null

      - name: price
        description: "Product selling price"
        tests:
          - not_null


  - name: stg_orders
    description: "Cleaned order staging data from RAW.ORDERS"

    columns:

      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order"
        tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed"
        tests:
          - not_null


  - name: stg_order_items
    description: "Order line-item staging data"

    columns:

      - name: order_item_id
        description: "Unique identifier for each order item"
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Parent order identifier"
        tests:
          - not_null

      - name: product_id
        description: "Purchased product identifier"
        tests:
          - not_null


  - name: stg_payments
    description: "Payment staging data"

    columns:

      - name: payment_id
        description: "Unique identifier for each payment"
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment"
        tests:
          - not_null

      - name: amount
        description: "Payment amount"
        tests:
          - not_null


  - name: stg_stores
    description: "Store staging data"

    columns:

      - name: store_id
        description: "Unique identifier for each store"
        tests:
          - not_null
          - unique

      - name: store_name
        description: "Store name"
        tests:
          - not_null

      - name: city
        description: "Store city"
        tests:
          - not_null